server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Forward API traffic to the Django backend on the Compose network, so the
    # browser stays on a single origin and no CORS/CSRF juggling is required.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page-app fallback: unknown paths render the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
