name: zero-leak-analytics

# Shared environment for every backend process (web, worker, migrate).
x-backend-env: &backend-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-change-me}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,frontend}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://localhost:8000}
  POSTGRES_DB: ${POSTGRES_DB:-zeroleak}
  POSTGRES_USER: ${POSTGRES_USER:-zeroleak}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeroleak}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  # Use the real broker/worker instead of running tasks inline in the web process.
  CELERY_TASK_ALWAYS_EAGER: "0"
  # Share rate-limit counters and task-ownership data across all processes.
  REDIS_CACHE_URL: redis://redis:6379/2
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_mock_dev_secret}
  # Opt-in first-run admin (only created when a password is supplied).
  DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
  DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
  DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zeroleak}
      POSTGRES_USER: ${POSTGRES_USER:-zeroleak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeroleak}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zeroleak} -d ${POSTGRES_DB:-zeroleak}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: apply migrations (and optionally seed an admin) before the
  # web/worker processes start.
  migrate:
    image: ${BACKEND_IMAGE:-zero-leak-backend:local}
    build:
      context: .
      dockerfile: Dockerfile
    environment: *backend-env
    command:
      - sh
      - -c
      - |
        set -e
        python manage.py migrate --noinput
        if [ -n "$DJANGO_SUPERUSER_PASSWORD" ]; then
          python manage.py createsuperuser --noinput || true
        fi
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE:-zero-leak-backend:local}
    build:
      context: .
      dockerfile: Dockerfile
    environment: *backend-env
    command: ["gunicorn", "core.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--timeout", "120"]
    volumes:
      - media_data:/app/media
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery:
    image: ${BACKEND_IMAGE:-zero-leak-backend:local}
    build:
      context: .
      dockerfile: Dockerfile
    environment: *backend-env
    command: ["celery", "-A", "core", "worker", "--loglevel=info"]
    volumes:
      - media_data:/app/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:-zero-leak-frontend:local}
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_data:
